# Minimum level that gets logged (lower levels are ignored), then the appender name.
# Levels from lowest to highest: TRACE < DEBUG < INFO < WARN < ERROR
#   ERROR -> only thrown exceptions
#   INFO  -> + application start/end
#   DEBUG -> + account creation, deposits and withdrawals (everything)
log4j.rootLogger = DEBUG, LOG1

# LOG1 writes to a file
log4j.appender.LOG1=org.apache.log4j.FileAppender
log = ./logs/App/log4j
log4j.appender.LOG1.File=${log}/log.out

# %d timestamp, %p priority, %t thread, %C class, %m message, %n new line
log4j.appender.LOG1.layout=org.apache.log4j.PatternLayout
log4j.appender.LOG1.layout.conversionPattern=%d %p [%t] %C - %m%n
