spring.application.name=lab15

# The Aiven host, port, database, user and password are in db.properties
# (next to this file). It is in .gitignore so the password never reaches GitHub.
# To create it, copy db.properties.example to db.properties and fill it in.
spring.config.import=classpath:db.properties

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Run schema.sql and data.sql at every start, also on a real (non-embedded) database
spring.sql.init.mode=always
